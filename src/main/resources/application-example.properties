# ===============================
# 1. DATABASE CONFIGURATION (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/your_database_name?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=your_mysql_username
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# 2. JPA & HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# 3. SERVER CONFIGURATION & JWT
# ===============================
server.port=8080

# Chèn một chuỗi mã hóa Base64 thật dài ngẫu nhiên vào đây để làm Secret Key cho JWT
jwt.secret=YOUR_BASE64_ENCODED_SECRET_KEY_HERE_MIN_256_BITS

# ===============================
# 4. EMAIL CONFIGURATION (Gmail)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Email dùng để gửi đi thông báo nhắc nợ
spring.mail.username=your_gmail_address@gmail.com
# Mật khẩu ứng dụng (App Password) sinh ra từ Google (KHÔNG dùng mật khẩu đăng nhập gốc)
spring.mail.password=your_16_char_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
